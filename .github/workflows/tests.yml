name: PowerShell tests

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          .\tests\Smoke.Tests.ps1
          .\tests\Behavior.Tests.ps1
          .\tests\Bootstrap.Tests.ps1
      - name: PowerShell 7
        shell: pwsh
        run: |
          ./tests/Smoke.Tests.ps1
          ./tests/Behavior.Tests.ps1
          ./tests/Bootstrap.Tests.ps1
      - name: Online startup
        shell: powershell
        run: |
          @('5', '0') | & powershell.exe -NoProfile -Command 'irm https://raw.githubusercontent.com/RustyPiano/win-dev-picker/main/bootstrap.ps1 | iex'
          if ($LASTEXITCODE -ne 0) { throw '在线启动失败。' }
